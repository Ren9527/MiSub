name = "misub"
pages_build_output_dir = "./dist"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]
[vars]
ADMIN_PASSWORD = "renren"
"d1_databases": [
    {
      "binding": "MISUB_DB",
      "database_id": "2ffe1fac-da30-42d8-affc-e82c2e02bf37"
    }
  ],
  "kv_namespaces": [
    {
      "binding": "MISUB_KV",
      "id": "cf3d28fed7ce4327a8b0992a2cf2ec85"
    }
  ],

# Pages 负责路由、KV 绑定、环境变量和 Cron 配置；这些运行时设置保留在
# Cloudflare Pages 项目中，避免在仓库配置里覆盖生产环境值。
